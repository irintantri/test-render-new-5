<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GxP Validation Document</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 10.5pt; line-height: 1.5; color: #1a1a2e;
    max-width: 900px; margin: 0 auto; padding: 28px;
  }
  h1 { font-size: 21pt; margin: 0 0 4px; }
  h2 { font-size: 13pt; margin: 22px 0 8px; border-bottom: 1px solid #d0d5dd; padding-bottom: 3px; }
  h3 { font-size: 11pt; margin: 16px 0 6px; }
  p { margin: 6px 0 10px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 9.5pt; }
  th, td { border: 1px solid #c9ced6; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #f1f3f7; font-weight: 600; }
  code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 9pt;
         background: #f1f3f7; padding: 1px 4px; border-radius: 3px; }
  pre { background: #f6f8fa; border: 1px solid #d0d5dd; border-radius: 6px;
        padding: 10px 12px; overflow: auto; font-size: 8.8pt; }
  pre code { background: none; padding: 0; }
  .docmeta { color: #475467; font-size: 9.5pt; margin: 0 0 14px; }
  .cover { text-align: center; padding-top: 32vh; page-break-after: always; }
  .cover h1 { font-size: 28pt; border: 0; }
  .cover .sub { color: #475467; margin-top: 10px; font-size: 12pt; }
  .doc-page { page-break-before: always; }
  .doc-page:first-of-type { page-break-before: avoid; }
  @media print {
    body { max-width: none; padding: 0; }
    a { color: inherit; text-decoration: none; }
    h2 { break-after: avoid; }
    tr, img, pre { break-inside: avoid; }
  }
</style>
</head>
